<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Palmira: Calles del Valle</title>
<meta name="description" content="Conduce por el centro real de Palmira, Valle del Cauca.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,600;1,700;1,800&display=swap">
<style>
/* Presentation in the spirit of big open-world crime games (original work, no third-party assets):
   radar bottom-left with health/armour bars, wanted stars + cash top-right, area/street bottom-right,
   centred subtitles, help box top-left, big centred banners, phone bottom-right, tabbed full-screen pause. */
:root{
  --ink:#0f1512;
  --panel:rgba(8,10,10,.72);
  --line:rgba(236,230,205,.16);
  --paper:#f4f1e6;        /* HUD text: warm white */
  --muted:#b9b39a;
  --taxi:#f4c430;         /* Colombian taxi yellow: destinations, primary accent */
  --cane:#2f7d4f;         /* Valle sugar-cane green */
  --cash:#6fcf5a;         /* money green */
  --hp:#5fbf55;
  --armor:#4a8fe0;
  --char:#6fb6ff;         /* character names in subtitles */
  --alert:#e5483b;
  --sky:#8fc3e6;
  --f-display:"Bungee","Arial Black",Impact,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --ts:0 0 2px #000,1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,0 3px 8px rgba(0,0,0,.55);
  --ts-soft:0 1px 2px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.45);
  --radarW:clamp(200px,20vw,290px);
  --sa-t:env(safe-area-inset-top,0px);--sa-b:env(safe-area-inset-bottom,0px);--sa-l:env(safe-area-inset-left,0px);--sa-r:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#0f1512;color:var(--paper);font-family:var(--f-body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
canvas#view{position:fixed;inset:0;width:100%;height:100%;display:block;background:#9cc8e4;transition:filter 1.2s ease,transform 5s cubic-bezier(.2,.6,.3,1)}
body.fx-grey canvas#view{filter:grayscale(1) contrast(1.18) brightness(.72);transform:scale(1.06)}
body.fx-busted canvas#view{filter:grayscale(.85) contrast(1.1) brightness(.78) hue-rotate(190deg) saturate(.6);transform:scale(1.05)}
body.fx-pause canvas#view{filter:blur(3px) brightness(.55) saturate(.7)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--taxi);outline-offset:2px}
.hud{position:fixed;pointer-events:none;z-index:5}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
kbd{font-family:var(--f-cond);font-weight:800;font-style:normal;background:var(--paper);color:#111;border-radius:3px;padding:0 6px;box-shadow:0 2px 0 rgba(0,0,0,.6);white-space:nowrap}

/* ---------- top-left help box */
#tl{left:calc(16px + var(--sa-l));top:calc(16px + var(--sa-t));display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 200px))}
#help{background:rgba(0,0,0,.74);padding:10px 13px;border-radius:3px;font-size:15px;line-height:1.38;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,.35);animation:helpIn .22s ease-out}
#help kbd{margin:0 2px}
#help .y{color:var(--taxi)} #help .b{color:var(--char)}
@keyframes helpIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}

/* ---------- top-right: wanted stars, cash, menu */
#status{top:calc(14px + var(--sa-t));right:calc(18px + var(--sa-r));display:flex;flex-direction:column;align-items:flex-end;gap:2px}
#stars{display:flex;gap:3px;height:26px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.8))}
#stars svg{width:26px;height:26px;transition:transform .25s}
#stars svg path{fill:rgba(0,0,0,.35);stroke:rgba(255,255,255,.55);stroke-width:1.4}
#stars svg.on path{fill:#fff;stroke:#111;stroke-width:1.2}
#stars.search svg.on path{animation:starBlink .5s steps(2) infinite}
#stars.flash svg.on{animation:starPop .5s ease-out 2}
@keyframes starBlink{50%{fill:rgba(0,0,0,.35);stroke:rgba(255,255,255,.55)}}
@keyframes starPop{50%{transform:scale(1.3)}}
#money{font-family:var(--f-cond);font-weight:800;font-size:38px;line-height:1;letter-spacing:.01em;font-variant-numeric:tabular-nums;color:#fff;text-shadow:var(--ts)}
#money .cur{color:var(--cash);margin-right:2px}
#moneyDelta{display:flex;flex-direction:column;align-items:flex-end;min-height:0}
#moneyDelta div{font-family:var(--f-cond);font-weight:800;font-size:26px;line-height:1.05;text-shadow:var(--ts);animation:dIn 3s ease-out forwards}
#moneyDelta .p{color:var(--cash)} #moneyDelta .m{color:#ff6a5a}
@keyframes dIn{0%{opacity:0;transform:translateX(40px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
#menuBtn{pointer-events:auto;margin-top:6px;padding:5px 11px;font-family:var(--f-cond);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px;cursor:pointer;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.18);border-radius:3px}

/* ---------- bottom-left radar + health/armour */
#radar{left:calc(16px + var(--sa-l));bottom:calc(16px + var(--sa-b));width:var(--radarW);display:flex;flex-direction:column;gap:4px}
#feed{display:flex;flex-direction:column;gap:5px;margin-bottom:6px}
#feed .n{background:rgba(0,0,0,.76);border-left:4px solid var(--taxi);padding:7px 10px;border-radius:2px;font-size:14px;line-height:1.3;animation:feedIn .3s ease-out;max-width:340px}
#feed .n b{display:block;font-family:var(--f-cond);font-weight:800;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:#fff}
#feed .n span{color:#d9d4c2}
#feed .n.out{opacity:0;transform:translateX(-20px);transition:.35s}
@keyframes feedIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
#mapwrap{width:100%;aspect-ratio:3/2;border-radius:9px;overflow:hidden;border:3px solid rgba(0,0,0,.6);box-shadow:0 4px 18px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.12);pointer-events:auto;cursor:pointer;background:#22292b}
#minimap{width:100%;height:100%;display:block}
#bars{display:grid;grid-template-columns:1fr 1fr;gap:4px}
#bars .bar{height:8px;background:rgba(0,0,0,.6);padding:1px;border-radius:1px;overflow:hidden}
#bars .bar b{display:block;height:100%;width:100%;transition:width .35s}
#bars .hp b{background:var(--hp)} #bars .hp.low b{background:var(--alert);animation:lowHp .8s ease-in-out infinite}
#bars .ar b{background:var(--armor)}
#bars .bar.track b{opacity:.85}
@keyframes lowHp{50%{opacity:.45}}

/* ---------- bottom-right: mission counters, speedo, area + street */
#br{right:calc(18px + var(--sa-r));bottom:calc(14px + var(--sa-b));display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right;max-width:min(460px,60vw)}
#mstack{display:flex;flex-direction:column;align-items:flex-end;gap:3px;margin-bottom:6px}
#mstack .c{display:flex;align-items:center;justify-content:space-between;gap:18px;min-width:200px;padding:5px 12px 5px 22px;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.72) 26%);font-family:var(--f-cond);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:14px;color:#ddd}
#mstack .c b{font-size:22px;color:#fff;font-weight:800;letter-spacing:.02em;font-variant-numeric:tabular-nums;text-shadow:var(--ts-soft)}
#mstack .c.warn b{color:#ff6a5a}
#mstack .c i{display:block;width:92px;height:9px;background:rgba(255,255,255,.18)} #mstack .c i u{display:block;height:100%;background:var(--taxi)}
#mstack .t{font-family:var(--f-cond);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--taxi);text-shadow:var(--ts-soft);max-width:340px}
#speedo{display:flex;align-items:baseline;gap:6px;text-shadow:var(--ts)}
#speedo .v{font-family:var(--f-cond);font-style:italic;font-weight:800;font-size:44px;line-height:.9;font-variant-numeric:tabular-nums}
#speedo .u{font-family:var(--f-cond);font-weight:700;letter-spacing:.12em;font-size:13px;color:#e8e3d0;text-transform:uppercase}
#speedo .dmg{width:64px;height:5px;background:rgba(0,0,0,.6);overflow:hidden;align-self:center;margin-left:6px;border:1px solid rgba(255,255,255,.25)}
#speedo .dmg b{display:block;height:100%;width:100%;background:var(--cane);transition:width .3s}
#area{font-family:var(--f-cond);font-style:italic;font-weight:800;font-size:clamp(28px,3vw,40px);line-height:1;color:#fff;text-shadow:var(--ts);letter-spacing:.005em;white-space:nowrap;transition:opacity .4s}
#area.new{animation:areaIn .6s ease-out}
@keyframes areaIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
#streetName{font-family:var(--f-cond);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;color:#e8e3d0;text-shadow:var(--ts);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#streetName:empty{display:none}

/* ---------- centred subtitles (objectives + dialogue) */
#subs{left:50%;bottom:calc(44px + var(--sa-b));transform:translateX(-50%);width:min(860px,calc(100vw - 2 * var(--radarW) - 80px));min-width:min(520px,92vw);text-align:center;font-size:clamp(17px,1.6vw,22px);font-weight:600;line-height:1.32;text-shadow:var(--ts);color:#fff;transition:opacity .35s}
#subs.off{opacity:0}
#subs .y,#help .y{color:var(--taxi)} #subs .b{color:var(--char)} #subs .r{color:#ff6a5a} #subs .g{color:#7be07b}
#subs .who{color:var(--char);font-weight:700}

/* ---------- mission title card, banners, full-screen states */
#mtitle{left:50%;top:30%;transform:translate(-50%,-50%);text-align:center;opacity:0;transition:opacity .6s;width:min(900px,94vw)}
#mtitle.on{opacity:1}
#mtitle b{display:block;font-family:var(--f-cond);font-style:italic;font-weight:800;font-size:clamp(40px,7vw,84px);line-height:.95;color:var(--taxi);text-shadow:var(--ts);letter-spacing:.005em}
#mtitle span{display:block;margin-top:8px;font-size:clamp(15px,1.6vw,19px);font-weight:600;text-shadow:var(--ts);color:#fff}
#banner{left:0;right:0;top:34%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;padding:20px 12px 18px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.68) 22%,rgba(0,0,0,.68) 78%,transparent);opacity:0;z-index:8}
#banner.on{animation:bannerIn 5.6s ease-out forwards}
#banner .b1{font-family:var(--f-display);font-size:clamp(34px,7.4vw,86px);line-height:1;color:#f2c230;text-shadow:0 4px 0 rgba(0,0,0,.6),0 0 22px rgba(0,0,0,.6);transform:skewX(-8deg);letter-spacing:.01em;text-align:center}
#banner.fail .b1{color:#e5483b}
#banner .b2{margin-top:10px;font-family:var(--f-cond);font-weight:700;font-size:clamp(17px,2vw,24px);letter-spacing:.08em;text-transform:uppercase;color:#fff;text-shadow:var(--ts);text-align:center}
#banner .b3{margin-top:4px;font-family:var(--f-cond);font-weight:800;font-size:clamp(22px,2.6vw,32px);color:var(--cash);text-shadow:var(--ts)}
#banner .b3:empty{display:none}
@keyframes bannerIn{0%{opacity:0;letter-spacing:.3em}8%{opacity:1;letter-spacing:.01em}82%{opacity:1}100%{opacity:0}}
#fxScreen{inset:0;display:grid;place-items:center;align-content:center;gap:10px;background:radial-gradient(ellipse at center,rgba(0,0,0,.05) 30%,rgba(0,0,0,.6));opacity:0;transition:opacity 1s;z-index:9}
#fxScreen.on{opacity:1}
#fxScreen .w{font-family:var(--f-display);font-size:clamp(52px,12vw,140px);line-height:1;transform:skewX(-8deg) scale(1.25);transition:transform 3.5s cubic-bezier(.1,.7,.2,1);text-shadow:0 5px 0 rgba(0,0,0,.6),0 0 30px rgba(0,0,0,.5)}
#fxScreen.on .w{transform:skewX(-8deg) scale(1)}
#fxScreen.wasted .w{color:#d8352b} #fxScreen.busted .w{color:#f4f1e6}
#fxScreen .s{font-size:clamp(15px,1.8vw,20px);font-weight:600;text-shadow:var(--ts);text-align:center;max-width:90vw}
#flash{inset:0;background:#fff;opacity:0;z-index:12}
#flash.on{animation:camFlash .45s ease-out}
@keyframes camFlash{0%{opacity:.85}100%{opacity:0}}

/* ---------- radio station popup */
#radioPop{left:50%;top:calc(18px + var(--sa-t));transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .4s;z-index:7}
#radioPop.on{opacity:1}
#radioPop small{display:block;font-family:var(--f-cond);font-weight:700;letter-spacing:.24em;font-size:12px;color:#d6d0bc;text-shadow:var(--ts-soft)}
#radioPop b{display:block;font-family:var(--f-cond);font-style:italic;font-weight:800;font-size:clamp(28px,3.4vw,42px);line-height:1;color:#fff;text-shadow:var(--ts)}
#radioPop span{display:block;font-size:14px;font-weight:600;color:var(--taxi);text-shadow:var(--ts-soft);margin-top:3px}
#radioPop .dots{display:flex;gap:5px;justify-content:center;margin-top:6px}
#radioPop .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35)} #radioPop .dots i.on{background:#fff}

/* ---------- prompt/talk/toast legacy nodes (kept for compatibility; restyled flows use the nodes above) */
#toast,#prompt,#talk{display:none!important}

/* ---------- phone */
#phone{position:fixed;right:calc(28px + var(--sa-r));bottom:calc(16px + var(--sa-b));z-index:14;width:clamp(240px,19vw,290px);aspect-ratio:9/17.5;max-height:calc(100vh - 40px);transform:translateY(calc(100% + 40px));transition:transform .32s cubic-bezier(.2,.8,.2,1);pointer-events:auto}
#phone.on{transform:none}
#phone .shell{position:absolute;inset:0;border-radius:30px;background:#16191b;box-shadow:0 18px 50px rgba(0,0,0,.6),inset 0 0 0 2px #2b3034,inset 0 0 0 8px #0b0d0e;padding:12px;display:flex}
#phone .scr{flex:1;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;background:linear-gradient(160deg,var(--ph-a,#1d5a3a),var(--ph-b,#0c1f17));position:relative}
#phone .sb{display:flex;justify-content:space-between;align-items:center;padding:7px 14px 2px;font-family:var(--f-cond);font-weight:700;font-size:13px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
#phone .hd{display:flex;align-items:center;gap:8px;padding:6px 12px 8px;font-family:var(--f-cond);font-weight:800;font-size:20px;letter-spacing:.02em;text-transform:uppercase}
#phone .hd button{background:rgba(255,255,255,.14);border:0;border-radius:50%;width:30px;height:30px;font-size:18px;line-height:1;cursor:pointer;flex:none;display:grid;place-items:center}
#phone .hd .ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#phone .bd{flex:1;min-height:0;overflow:auto;padding:4px 10px 10px;scrollbar-width:none}
#phone .bd::-webkit-scrollbar{display:none}
#phone .ft{display:flex;justify-content:space-around;padding:6px 8px 9px;font-family:var(--f-cond);font-size:12px;font-weight:600;color:rgba(255,255,255,.7);letter-spacing:.04em}
#phone .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 6px;padding-top:10px}
#phone .app{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;cursor:pointer;padding:4px 0;border-radius:12px;position:relative}
#phone .app .ic{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;box-shadow:0 3px 8px rgba(0,0,0,.35)}
#phone .app .ic svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#phone .app span{font-size:12px;font-weight:600}
#phone .app .badge{position:absolute;top:0;right:12%;min-width:18px;height:18px;border-radius:9px;background:#e5483b;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
#phone .sel{outline:3px solid #fff;outline-offset:-1px;background:rgba(255,255,255,.12)}
#phone .list{display:flex;flex-direction:column;gap:6px}
#phone .it{display:flex;align-items:center;gap:10px;text-align:left;width:100%;background:rgba(0,0,0,.28);border:0;border-radius:10px;padding:9px 10px;cursor:pointer}
#phone .it .av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-cond);font-weight:800;font-size:15px;background:rgba(255,255,255,.18)}
#phone .it .tx{flex:1;min-width:0}
#phone .it .tx b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#phone .it .tx span{display:block;font-size:12px;color:rgba(255,255,255,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#phone .it .dot{width:9px;height:9px;border-radius:50%;background:#e5483b;flex:none}
#phone .it.on{box-shadow:inset 0 0 0 2px var(--taxi)}
#phone .it.dim{opacity:.55}
#phone .msgs{display:flex;flex-direction:column;gap:8px;padding-top:4px}
#phone .bub{background:rgba(255,255,255,.92);color:#16201a;border-radius:14px 14px 14px 4px;padding:8px 11px;font-size:13.5px;line-height:1.35;max-width:88%}
#phone .bub small{display:block;color:#56645b;font-size:11px;margin-top:3px}
#phone .call{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:30px;text-align:center}
#phone .call .av{width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-family:var(--f-cond);font-weight:800;font-size:34px}
#phone .call b{font-size:20px} #phone .call span{color:rgba(255,255,255,.75);font-size:14px}
#phone .call .ring{animation:ring 1s ease-in-out infinite}
@keyframes ring{50%{transform:scale(1.08)}}
#phone .gal{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#phone .gal button{padding:0;border:0;border-radius:6px;overflow:hidden;aspect-ratio:16/10;cursor:pointer;background:#000}
#phone .gal img{width:100%;height:100%;object-fit:cover;display:block}
#phone .photo{width:100%;border-radius:8px;display:block}
#phone .note{font-size:12.5px;color:rgba(255,255,255,.75);line-height:1.4;margin:8px 2px}
#phone .rng{display:flex;align-items:center;gap:8px;width:100%}
#phone .rng i{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden} #phone .rng i u{display:block;height:100%;background:#fff}

/* ---------- touch controls */
#touch{position:fixed;inset:0;z-index:6;pointer-events:none}
#touch .zone{position:absolute;pointer-events:auto;touch-action:none}
#steerZone{left:0;bottom:0;width:45%;height:55%}
#steerKnob{position:absolute;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;border:3px solid rgba(242,236,214,.6);background:rgba(14,22,18,.35);display:none}
#steerKnob::after{content:"";position:absolute;inset:24px;border-radius:50%;background:rgba(242,236,214,.75)}
.tbtn{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;background:rgba(10,12,12,.55);border:2px solid rgba(242,236,214,.55);font-family:var(--f-cond);font-weight:700;letter-spacing:.06em;font-size:14px;display:grid;place-items:center;text-transform:uppercase}
.tbtn.on{background:rgba(244,196,48,.7);color:#1a1405}
.tbtn .badge{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:8px;background:#e5483b;font-size:10px;display:grid;place-items:center;color:#fff}
#tGas{right:18px;bottom:calc(120px + var(--sa-b));width:86px;height:86px}
#tBrake{right:116px;bottom:calc(70px + var(--sa-b));width:72px;height:72px}
#tHand{right:30px;bottom:calc(220px + var(--sa-b));width:58px;height:58px;font-size:12px}
#tUse{right:104px;bottom:calc(160px + var(--sa-b));width:58px;height:58px}
#tHorn{right:180px;bottom:calc(150px + var(--sa-b));width:52px;height:52px;font-size:12px}
#tCam,#tPhone,#tRadio{width:46px;height:46px;font-size:11px;right:calc(14px + var(--sa-r))}
#tCam{top:calc(206px + var(--sa-t))} #tPhone{top:calc(258px + var(--sa-t))} #tRadio{top:calc(310px + var(--sa-t))}

body.touch{--radarW:140px}
body.touch #radar{top:calc(10px + var(--sa-t));bottom:auto;left:calc(10px + var(--sa-l))}
body.touch #feed{margin:0}
body.touch #feed .n{font-size:12px;padding:5px 8px;max-width:62vw}
body.touch #feed .n b{font-size:13px}

<script type="module">
import * as THREE from 'three';
// ===== 00_core.js
// Core: data, geometry helpers, spatial grids, save/settings, input.
// World axes: x = East (m), z = -North (m), y = up. Data is stored as decimetres in local TM (x=E, y=N).

// Module hooks: files register optional functions here, e.g. HOOKS.buildStreet = () => {...}
const HOOKS = {};
const _embedded = document.getElementById('palmira-data')?.textContent.trim();
const RAW = _embedded && _embedded[0] === '{' ? JSON.parse(_embedded) : await (async () => {
  const el = document.getElementById('loading');
  const res = await fetch('data/palmira.json');
  if (!res.ok) throw new Error('No se pudo descargar el mapa (' + res.status + ')');
  if (el) el.textContent = 'Armando Palmira…';
  return res.json();
})();
const D = RAW;
const IS_TOUCH = matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window && navigator.maxTouchPoints > 0);
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const GRID_ROT = 8.5 * Math.PI / 180;   // street grid rotation (clockwise from north), from OSM bearings

// decimetre flat array [e,n,e,n..] -> array of {x,z}
function ptsOf(flat) {
  const out = [];
  for (let i = 0; i < flat.length; i += 2) out.push({ x: flat[i] / 10, z: -flat[i + 1] / 10 });
  return out;
}
function hash(n) { n = (n ^ 61) ^ (n >>> 16); n = n + (n << 3); n = n ^ (n >>> 4); n = Math.imul(n, 0x27d4eb2d); n = n ^ (n >>> 15); return (n >>> 0) / 4294967296; }

let rngState = 12345;
function rand() { rngState = (rngState * 1664525 + 1013904223) >>> 0; return rngState / 4294967296; }

function pointInPoly(x, z, P) {
  let inside = false;
  for (let i = 0, j = P.length - 1; i < P.length; j = i++) {
    const a = P[i], b = P[j];
    if (((a.z > z) !== (b.z > z)) && (x < (b.x - a.x) * (z - a.z) / (b.z - a.z) + a.x)) inside = !inside;
  }
  return inside;
}
function polyArea(P) { let s = 0; for (let i = 0, j = P.length - 1; i < P.length; j = i++) s += (P[j].x + P[i].x) * (P[j].z - P[i].z); return s / 2; }
function centroid(P) { let x = 0, z = 0; for (const p of P) { x += p.x; z += p.z; } return { x: x / P.length, z: z / P.length }; }
function bboxOf(P) { let a = Infinity, b = Infinity, c = -Infinity, d = -Infinity; for (const p of P) { if (p.x < a) a = p.x; if (p.z < b) b = p.z; if (p.x > c) c = p.x; if (p.z > d) d = p.z; } return [a, b, c, d]; }
// closest point on segment
function segClosest(px, pz, ax, az, bx, bz) {
  const dx = bx - ax, dz = bz - az, L2 = dx * dx + dz * dz || 1e-9;
  let t = ((px - ax) * dx + (pz - az) * dz) / L2; t = clamp(t, 0, 1);

}

// ---------------------------------------------------------------- spatial grid
class Grid {
  constructor(cell) { this.cell = cell; this.map = new Map(); }
  key(ix, iz) { return ix * 73856093 ^ iz * 19349663; }
  insertBox(item, x0, z0, x1, z1) {
    const c = this.cell;
    for (let ix = Math.floor(x0 / c); ix <= Math.floor(x1 / c); ix++)
      for (let iz = Math.floor(z0 / c); iz <= Math.floor(z1 / c); iz++) {
        const k = this.key(ix, iz); let a = this.map.get(k); if (!a) this.map.set(k, a = []); a.push(item);
      }
  }
  query(x, z, r, out = [], stamp) {
    const c = this.cell;
    for (let ix = Math.floor((x - r) / c); ix <= Math.floor((x + r) / c); ix++)
      for (let iz = Math.floor((z - r) / c); iz <= Math.floor((z + r) / c); iz++) {
        const a = this.map.get(this.key(ix, iz)); if (!a) continue;
        for (const it of a) { if (stamp !== undefined) { if (it._q === stamp) continue; it._q = stamp; } out.push(it); }
      }
    return out;
  }
}
let QSTAMP = 1;

// ---------------------------------------------------------------- parsed world data
const W = { buildings: [], blocks: [], parks: [], landmarks: {}, nodes: [], edges: [], walks: [], signals: new Set(D.signals) };
// buildings: compact tuples [flatP, heightDm, storeys, source, kindIndex, id?] (source: c = Alcaldía cadastre with real floors,
// o = OSM, m = Microsoft footprint with estimated height); older data files use objects.
for (const b of D.buildings) {
  const t = Array.isArray(b) ? { p: b[0], hgt: b[1], st: b[2], s: b[3], k: D.bkinds[b[4]], id: b[5] } : b;
  const P = ptsOf(t.p); if (polyArea(P) > 0) P.reverse();   // keep CCW in x/z (clockwise in E/N)
  W.buildings.push({ P, h: t.hgt / 10, st: t.st, s: t.s, hs: t.s === 'c' ? 'cat' : t.hs, k: t.k, id: t.id, bb: bboxOf(P), c: centroid(P) });
}
for (const b of D.blocks) {
  const P = ptsOf(b.p), H = (b.h || []).map(ptsOf);
  W.blocks.push({ P, H, g: b.g, bb: bboxOf(P) });
}
for (const l of D.landmarks) {
  const P = ptsOf(l.p);
  (W.landmarks[l.k] = W.landmarks[l.k] || []).push({ P, n: l.n, id: l.id, c: centroid(P), bb: bboxOf(P) });

for (const s of D.signals) W.nodes[s].sig = true;

  W.edges.push(e);
  // adjacency: direction +1 means a->b along P
  if (road.o >= 0) W.nodes[a].out.push({ e, dir: 1 });
  if (road.o <= 0) W.nodes[b].out.push({ e, dir: -1 });
});
W.walks = D.walks.map(f => { const P = ptsOf(f); const cum = [0]; for (let k = 1; k <= P.length; k++) { const p = P[k - 1], q = P[k % P.length]; cum.push(cum[k - 1] + Math.hypot(q.x - p.x, q.z - p.z)); } return { P, cum, L: cum[cum.length - 1], c: centroid(P) }; });

// remove generic footprints that sit inside hand-built landmarks (cathedral, CAMP, churches get custom geometry)
// (the CAMP keeps its cadastre parts when they exist: those have real floor counts)
const CAMP_HAS_CADASTRE = (W.landmarks.camp || []).some(L => W.buildings.some(b => b.s === 'c' && pointInPoly(b.c.x, b.c.z, L.P)));
for (const k of CAMP_HAS_CADASTRE ? ['cathedral'] : ['cathedral', 'camp']) for (const L of (W.landmarks[k] || [])) {

}

// edge sampling
function edgePoint(e, s) {   // s in [0, L] from node a
  s = clamp(s, 0, e.L);
  let k = 1; while (k < e.cum.length - 1 && e.cum[k] < s) k++;

}

//   - Positions / footprints: OpenStreetMap (ODbL) ways 552002312 (cathedral), 510234178 (CAMP),

//     annex), 421415404 (Carmelos), 553396337 (Trinidad), 1450778693 (Galería), Microsoft footprints

//     "Palmira (Colombia)" (dates, architects). Dimensions not given by footprints are ESTIMATED from photo

  const G0 = KERB - 0.02;                      // building base, same as buildBuildings()

    }
  }

  }

  // ------------------------------------------------------------ Face: a vertical plane (origin o, tangent t, outward normal n); s along t, off along n

    q(a, b, c, d, cl) { quadN(this.gb, a, b, c, d, this.N, cl); }
    rect(s0, s1, y0, y1, off, cl) { this.q(this.p(s0, y0, off), this.p(s1, y0, off), this.p(s1, y1, off), this.p(s0, y1, off), cl); }
    tri(s0, y0, s1, y1, s2, y2, off, cl) { this.gb.tri(this.p(s0, y0, off), this.p(s1, y1, off), this.p(s2, y2, off), this.N, lit(cl, this.N)); }

    }

  // ------------------------------------------------------------ Frame: local axes U (along the front), V (into the building), origin o
  class Frame {
    constructor(gb, o, U, V) { this.gb = gb; this.o = o; this.U = U; this.V = V; this.rot = Math.atan2(U.z, U.x); }
    P(u, v) { return { x: this.o.x + this.U.x * u + this.V.x * v, z: this.o.z + this.U.z * u + this.V.z * v }; }

    box(u, v, y, su, sv, sy, cl) { const p = this.P(u, v); this.gb.box(p.x, G0 + y + sy / 2, p.z, su, sy, sv, cl, this.rot); }

        if (endCl) { const n0 = [-this.V.x, 0, -this.V.z], n1 = [this.V.x, 0, this.V.z]; g.tri(this.W(u0, ye, v0), this.W(u1, ye, v0), this.W(um, yr, v0), n0, lit(endCl, n0)); g.tri(this.W(u0, ye, v1), this.W(u1, ye, v1), this.W(um, yr, v1), n1, lit(endCl, n1)); }

  // ------------------------------------------------------------ shared bookkeeping
  function info(n, x, z, note, extra) {
    for (let i = LANDMARK_INFO.length - 1; i >= 0; i--) if (LANDMARK_INFO[i].n === n) LANDMARK_INFO.splice(i, 1);
    LANDMARK_INFO.push(Object.assign({ n, x, z, note }, extra || {}));

  function solid(P, h, id) { const b = { P, h, st: Math.max(1, Math.round(h / 3.3)), s: 'lm', hs: 'est', k: 'landmark', id, bb: bboxOf(P), c: centroid(P) }; bGrid.insertBox(b, ...b.bb); return b; }

  function circleP(x, z, r, n) { const P = []; for (let i = 0; i < n; i++) { const a = i / n * TAU; P.push({ x: x + Math.sin(a) * r, z: z + Math.cos(a) * r }); } return P; }

const PURSUIT = {

  addHeat(v, x, z, reason) {

    if (this.level > before) toast('Alerta ' + '▮'.repeat(this.level), reason || 'La Patrulla Urbana te está buscando.');

};

function updatePursuit(dt, ctx) {

}

function curbPoint(x, z, street) {   // nearest drivable road point near a place (optionally on a named street), nudged to the kerb side
  const ok = e => (CLASS_SPEED[e.cls] || 0) > 0 && e.cls !== 'service';
  const ne = (street && nearestEdge(x, z, 150, e => ok(e) && e.name === street)) || nearestEdge(x, z, 150, ok);

}

  const vMax = d < 25 ? 17 : d < 70 ? 15 : 11;
  t.v += clamp(vMax - t.v, -6 * dt, 3.5 * dt);
  t.s += t.v * dt;
  while (t.s > t.e.L) {
    const n = t.dir === 1 ? t.e.b : t.e.a, opts = allEdgesAt(n).filter(o => o.e !== t.e && (CLASS_SPEED[o.e.cls] || 0) > 0);
    if (!opts.length) { t.dir = -t.dir; t.s = 0; break; }
    let best = opts[0], bs = -Infinity;
    for (const o of opts) {
      const far = W.nodes[o.dir === 1 ? o.e.b : o.e.a]; const away = Math.hypot(far.x - car.x, far.z - car.z), cen = Math.hypot(far.x, far.z);
      const sc = away - Math.max(0, cen - 900) * 2 + rand() * 25;   // stay inside the reconstructed centre
      if (sc > bs) { bs = sc; best = o; }
    }
    t.s -= t.e.L; t.e = best.e; t.dir = best.dir;
  }
  const param = t.dir === 1 ? t.s : t.e.L - t.s, p = edgePoint(t.e, param);
  const fx = p.dx * t.dir, fz = p.dz * t.dir;
  t.x = lerp(t.x, p.x + (-fz) * 1.5, 1 - Math.exp(-10 * dt)); t.z = lerp(t.z, p.z + fx * 1.5, 1 - Math.exp(-10 * dt));
  const ta = Math.atan2(-fz, fx); let da = ((ta - t.a + Math.PI) % TAU + TAU) % TAU - Math.PI; t.a += da * Math.min(1, 7 * dt);
  t.fx = fx; t.fz = fz;
  t.mesh.position.set(t.x, 0, t.z); t.mesh.rotation.y = t.a;
  MISSIONS.waypoint = { x: t.x, z: t.z };
  if (d < 9) t.press += dt; else t.press = Math.max(0, t.press - dt * 0.5);
  if (t.hits >= 3 || t.press > 5) { t.active = false; t.mesh.visible = false; toast('¡Lo agarraste!', 'El ladrón dejó el carro y salió corriendo.'); MISSIONS.stage = 2; enterStage(); MISSIONS.recovered = true; }
  else if (d > 260) failMission('El ladrón se escapó.');
}

function updateMissions(dt, ctx) {
  const d = MISSIONS.active, car = G.car;
  // passive: mission givers & taller prompts
  if (!d) {
    for (const m of availableMissions()) if (m.marker && Math.hypot(m.at.x - ctx.px, m.at.z - ctx.pz) < 6) { showPrompt(`<kbd>${IS_TOUCH ? 'Usar' : 'E'}</kbd> ${m.title} · ${m.giver}`); if (pressed.has('use')) { pressed.delete('use'); startMission(m); } return; }
  }
  if (G.inCar && Math.hypot(PLACES.taller.x - ctx.px, PLACES.taller.z - ctx.pz) < 6 && ctx.speed < 2) { showPrompt(`<kbd>${IS_TOUCH ? 'Usar' : 'E'}</kbd> Entrar al Taller Don Efra`); if (pressed.has('use')) { pressed.delete('use'); openTaller(); } return; }
  if (!d) return;
  if (d.race) {
    MISSIONS.raceT += dt;
    const c = MISSIONS.cps[MISSIONS.cp];
    if (c && Math.hypot(c.x - ctx.px, c.z - ctx.pz) < 12) { MISSIONS.cp++; AUDIO.blip(); if (MISSIONS.cp >= MISSIONS.cps.length) { completeMission(); return; } enterStage(); }
    if (MISSIONS.raceT > 240) failMission('Se acabó el tiempo.');
    return;
  }
  const st = d.stages[MISSIONS.stage];
  if (st.time) { MISSIONS.timer -= dt; if (MISSIONS.timer <= 0) { failMission('Se acabó el tiempo.'); return; } }
  if ((st.careful || st.fragile) && car.impact > 4) { MISSIONS.payK = Math.max(0.3, MISSIONS.payK - 0.12); toast(st.fragile ? '¡La carga!' : '¡Ay, mijo!', st.fragile ? 'Pago reducido' : 'Doña Marleny se asustó'); car.impact = 0; if (st.fragile && MISSIONS.payK <= 0.31) { failMission('La carga se dañó.'); return; } }
  if (st.chase) { updateThief(dt, car); return; }
  if (d.comments && MISSIONS.stage === 1) for (const [k, text] of d.comments) { const l = lm(k); if (l && talkT <= 0 && !MISSIONS.comments.has(k) && Math.hypot(l.x - ctx.px, l.z - ctx.pz) < 70) { MISSIONS.comments.add(k); talk('Doña Marleny', text); } }
  if (st.to) {
    const dd = Math.hypot(st.to.x - ctx.px, st.to.z - ctx.pz), r = st.radius || 6;
    if (dd < r && (!st.stop || ctx.speed < 2.2) && (G.inCar || !st.stop)) {
      st.onArrive && st.onArrive();
      if (st.chase || MISSIONS.active !== d) return;
      MISSIONS.stage++;
      if (MISSIONS.stage >= d.stages.length) completeMission(); else enterStage();
    } else if (dd < r && st.stop && G.inCar) showPrompt('Detente en el punto');
  }
}
function missionHud() {
  const d = MISSIONS.active;
  if (!d) {
    const n = availableMissions().length;
    return { eyebrow: 'Libre · Palmira Centro', text: n ? `${n} encargo${n > 1 ? 's' : ''} disponible${n > 1 ? 's' : ''}: busca los círculos amarillos en el mapa.` : 'Explora el centro. Pulsa M para el mapa.', timer: null };

// ---------------------------------------------------------------- speech bubbles
function makeBubble() {
  const cv = document.createElement('canvas'); cv.width = 768; cv.height = 160;
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
  sp.scale.set(6.2, 1.3, 1); sp.renderOrder = 10; sp.visible = false;
  return { sp, cv, tex, t: 0, text: '' };
}
function drawBubble(b, text, who) {
  const g = b.cv.getContext('2d'), W0 = b.cv.width, H0 = b.cv.height;
  g.clearRect(0, 0, W0, H0);
  g.font = '600 38px "Barlow", sans-serif';
  let lines = [], line = ''; for (const w of text.split(' ')) { const t = line ? line + ' ' + w : w; if (g.measureText(t).width > W0 - 60) { lines.push(line); line = w; } else line = t; } lines.push(line); lines = lines.slice(0, 2);
  const tw = Math.max(...lines.map(l => g.measureText(l).width)) + 44, th = lines.length * 46 + 30;
  const x0 = (W0 - tw) / 2, y0 = H0 - th - 14;
  g.fillStyle = 'rgba(242,236,214,.96)'; g.strokeStyle = '#14301f'; g.lineWidth = 4;
  g.beginPath(); g.roundRect(x0, y0, tw, th, 18); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(W0 / 2 - 14, y0 + th - 2); g.lineTo(W0 / 2, H0 - 2); g.lineTo(W0 / 2 + 14, y0 + th - 2); g.fill();
  g.fillStyle = '#14301f'; g.textAlign = 'center'; g.textBaseline = 'top';
  lines.forEach((l, i) => g.fillText(l, W0 / 2, y0 + 16 + i * 46));
  b.tex.needsUpdate = true; b.text = text;
}

// ---------------------------------------------------------------- placement helpers
function sidewalkSpot(x, z, along = 0) {
  let best = null, bd = Infinity;
  for (const r of PEDS.ringGrid.query(x, z, 120, [], QSTAMP++)) {
    for (let k = 0; k < r.P.length; k++) {
      const p = r.P[k], q = r.P[(k + 1) % r.P.length], c = segClosest(x, z, p.x, p.z, q.x, q.z), d = Math.hypot(c.x - x, c.z - z);
      if (d < bd) { bd = d; best = { r, s: r.cum[k] + c.t * (r.cum[k + 1] - r.cum[k]) }; }
    }
  }
  if (!best) return { x, z, a: 0, ring: null, s: 0 };
  const q = ringPoint(best.r, best.s + along);
  const ne = nearestEdge(q.x, q.z, 30), a = ne ? Math.atan2(-(ne.z - q.z), ne.x - q.x) : 0;   // face the street
  return { x: q.x, z: q.z, a, ring: best.r, s: best.s + along };
}
function fwdOf(a) { return { x: Math.cos(a), z: -Math.sin(a) }; }
function placeObj(obj, x, z, a, y = KERB) { obj.position.set(x, y, z); obj.rotation.y = a; }
function meshOf(geo, mat = MAT_V) { const m = new THREE.Mesh(geo, mat); m.castShadow = QL.shadow > 0; return m; }
function localOff(spot, fwd, side) { const f = fwdOf(spot.a); return { x: spot.x + f.x * fwd + (-f.z) * side, z: spot.z + f.z * fwd + f.x * side }; }

function updateNpcs(dt, ctx) {
  let best = null, bd = Infinity;
  for (const n of NPCS.list) {
    if (n.hidden) { n.update && n.update(dt, ctx); n.group.visible = false; continue; }
    // walkers follow their sidewalk ring with stops
    if (n.ring && n.walk) {
      n.stopT = (n.stopT || 0) - dt;
      if (n.stopT <= 0) { n.s += n.walk * dt; n.walkedT = (n.walkedT || 0) + dt; if (n.stopEvery && n.walkedT > n.stopEvery) { n.walkedT = 0; n.stopT = 8; } }
      const q = ringPoint(n.ring, n.s); n.x = q.x; n.z = q.z; n.a = Math.atan2(-q.dz, q.dx);
    }
    n.update && n.update(dt, ctx);
    const d = n.baseUpdate(dt, ctx);
    const usable = (ctx.walker && d < n.r) || (n.inCarUse && !ctx.walker && d < 9);
    if (usable && n.use && d < bd) { bd = d; best = n; }
  }
  if (NPCS.offerT > 0) { NPCS.offerT -= dt; if (NPCS.offer) { showPrompt(`<kbd>${IS_TOUCH ? 'Usar' : 'E'}</kbd> Aceptar: ${NPCS.offer.title}`); if (pressed.has('use')) { pressed.delete('use'); startMission(NPCS.offer); NPCS.offer = null; NPCS.offerT = 0; } return; } }
  if (best && !promptShown) {
    showPrompt(`<kbd>${IS_TOUCH ? 'Usar' : 'E'}</kbd> ${best.prompt} · ${best.name}`);
    if (pressed.has('use')) { pressed.delete('use'); best.use(); }
  }
  // content creator reacts to crashes nearby
  const cr = NPCS.list.find(n => n.id === 'creadora');
  NPCS.viralT -= dt;
  if (cr && ctx.car && ctx.car.impact > 4.5 && NPCS.viralT <= 0 && Math.hypot(ctx.car.x - cr.x, ctx.car.z - cr.z) < 50) { NPCS.viralT = 60; cr.say('¡Yo estaba grabando la comida! ¡Mire lo que pasó atrás!', 4); SAVE.money += 2000; toast('Te volviste viral', 'Valen subió el video: +$2.000'); }
  // party after the mission chain: salsa couple moves to the street and music plays
  if (NPCS.party && !NPCS.partyOn) { NPCS.partyOn = true; const s = NPCS.list.find(n => n.id === 'salsa'), o = NPCS.list.find(n => n.id === 'organizadora'); if (s && o) { s.x = o.x + 3; s.z = o.z + 2; s.y = KERB; } }
}

// ---------------------------------------------------------------- player health / armour ("resistencia")
// Health is the player's own; car damage stays in G.car.damage. Other modules may call PLAYER.hurt(n, why).
const PLAYER = {
  health: 100, armor: 0, maxHealth: 100, maxArmor: 100, state: 'ok', lastHurt: 0, cd: 0,
  hurt(n, why) {
    if (this.state !== 'ok' || !(n > 0) || !G.started) return;
    const a = Math.min(this.armor, n * 0.66); this.armor -= a; this.health = Math.max(0, this.health - (n - a));
    this.lastHurt = performance.now(); hurtFlash();
    if (this.health <= 0) playerDown(why);
  },
  heal(n = 100) { this.health = Math.min(this.maxHealth, this.health + n); },
  addArmor(n = 100) { this.armor = Math.min(this.maxArmor, this.armor + n); },
};

// ---------------------------------------------------------------- UI sounds (WebAudio, synthesised; silent until the player presses Play)
let _uiNoise = null;
function uiTone(t0, f, dur, type = 'triangle', g = 0.08, o = {}) {
  const ctx = AUDIO.ctx; if (!ctx || !AUDIO.master) return;
  const osc = ctx.createOscillator(), a = ctx.createGain(); osc.type = type; osc.frequency.setValueAtTime(f, t0);
  if (o.glide) osc.frequency.exponentialRampToValueAtTime(o.glide, t0 + dur);
  if (o.detune) osc.detune.value = o.detune;
  a.gain.setValueAtTime(0.0001, t0); a.gain.linearRampToValueAtTime(g, t0 + (o.att || 0.01));
  if (o.hold) a.gain.setValueAtTime(g, t0 + o.hold);
  a.gain.exponentialRampToValueAtTime(0.0005, t0 + dur);
  let n = osc; if (o.lp) { const fl = ctx.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = o.lp; osc.connect(fl); n = fl; }
  n.connect(a); a.connect(AUDIO.master); osc.start(t0); osc.stop(t0 + dur + 0.05);
}
function uiNoise(t0, dur, g = 0.1, freq = 2000, type = 'bandpass', q = 0.8) {
  const ctx = AUDIO.ctx; if (!ctx || !AUDIO.master) return;
  if (!_uiNoise) { _uiNoise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate); const d = _uiNoise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const s = ctx.createBufferSource(); s.buffer = _uiNoise; s.loop = true; const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const a = ctx.createGain(); a.gain.setValueAtTime(g, t0); a.gain.exponentialRampToValueAtTime(0.0005, t0 + dur);
  s.connect(f); f.connect(a); a.connect(AUDIO.master); s.start(t0); s.stop(t0 + dur + 0.05);
}
function uiSound(kind) {
  const ctx = AUDIO.ctx; if (!ctx) return; const t = ctx.currentTime + 0.02, N = m => 440 * Math.pow(2, (m - 69) / 12);
  const chord = (t0, ms, dur, g, type = 'sawtooth', lp = 2400) => ms.forEach((m, i) => { uiTone(t0, N(m), dur, type, g, { lp, att: 0.03, hold: dur * 0.5, detune: (i % 2 ? 7 : -7) }); });

    const pads = navigator.getGamepads ? navigator.getGamepads() : [];

      const e = {};
      for (const i of [0, 1, 4, 5, 12, 13, 14, 15]) { const k = gp.index + ':' + i, p = !!gp.buttons[i]?.pressed; e[i] = p && !PADUI.prev[k]; PADUI.prev[k] = p; }

      if (PHONE.open) { if (e[12]) PHONE.nav(0, -1); if (e[13]) PHONE.nav(0, 1); if (e[14]) PHONE.nav(-1, 0); if (e[15]) PHONE.nav(1, 0); if (e[0]) PHONE.ok(); if (e[1]) PHONE.back(); continue; }

// ===== 58_radio.js
// In-vehicle radio: four fictional stations, every note synthesised live with WebAudio (no recordings, no samples).
//  · Caña FM 104.3        salsa: son clave 3-2, campana, conga tumbao, piano montuno with anticipations, bass tumbao, horn stabs
//  · La Recta 98.1        urbano: dembow (kick on the beat, snare on 3·6·11·14), 808 bass, plucked arpeggios, pad
//  · Valle Stéreo 89.5    vallenato/cumbia: guacharaca scrapes, caja, accordion-like square waves in thirds with vibrato, bass on 1 & 3
//  · Noticias del Valle 1040 AM   talk: synthesised jingle + time pips, two formant "voices" murmuring through an AM-band filter
// Plays only while the player is in a vehicle (and the game isn't paused). Q/R or gamepad d-pad ←/→ switch, phone Radio app tunes.
// Uses AUDIO.ctx / AUDIO.master (null until the player presses Play); everything is created lazily.

const RADIO = (() => {
  const st = { want: -1, playing: -1, last: 0, bus: null, filt: null, out: null, nextT: 0, step: 0, duckUntil: 0, vol: 0.7, auto: true, wasIn: false, noise: null, ctx: null, popT: null, data: null };
  const BASE = 0.28;

  const ctx = () => AUDIO.ctx;

  // ------------------------------------------------ graph + voices
  function ensureGraph() {

    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 7000;   // small car speakers
    const comp = c.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 3; comp.attack.value = 0.01; comp.release.value = 0.2;
    st.out = c.createGain(); st.out.gain.value = 0;
    hp.connect(lp); lp.connect(comp); comp.connect(st.out); st.out.connect(AUDIO.master);
    st.filt = hp; newBus();

    const c = ctx(); const old = st.bus;
    if (old) { try { old.gain.setTargetAtTime(0, c.currentTime, 0.03); setTimeout(() => { try { old.disconnect(); } catch (e) { } }, 600); } catch (e) { } }
    st.bus = c.createGain(); st.bus.gain.value = 1; st.bus.connect(st.filt);

  }
  function postWanted() { return ATM_CFG.POST && P_.ok && !IS_TOUCH && (QL === Q.media || QL === Q.alta); }
  function postSize(r) {
    r.getDrawingBufferSize(P_.size); const w = Math.max(1, P_.size.x | 0), h = Math.max(1, P_.size.y | 0);

  function pass(r, mat, target) { P_.mesh.material = mat; r.setRenderTarget(target); r.render(P_.scene, P_.cam); }
  function render(r, s, c) {
    if (!postWanted()) { if (P_.on) { P_.on = false; r.info.autoReset = true; } r.render(s, c); return; }
    try {
      if (!P_.mats) postInit();

      M.pre.uniforms.tSrc.value = P_.rt.texture; M.pre.uniforms.uTh.value = lerp(0.95, 0.5, P_.night); pass(r, M.pre, P_.b1);
      M.blur.uniforms.tSrc.value = P_.b1.texture; M.blur.uniforms.uOff.value = 1; pass(r, M.blur, P_.b2);
      M.blur.uniforms.tSrc.value = P_.b2.texture; M.blur.uniforms.uOff.value = 2.5; pass(r, M.blur, P_.b1);
      const f = M.fin.uniforms;

      f.uBloom.value = lerp(0.32, 0.75, P_.night) + 0.2 * P_.gold; f.uExp.value = lerp(1.0, 1.18, P_.night) * (1 + 0.06 * P_.k);
      f.uGold.value = P_.gold; f.uNight.value = P_.night; f.uOvc.value = P_.k; f.uVig.value = 0.3 + 0.08 * P_.night;

    }
  }

  // ------------------------------------------------------------------ init / update
  function init() {
    S.date = colDate(0);
    if (ATM_CFG.RESUME && SAVE.atmo && isFinite(SAVE.atmo.h)) S.hour = clamp(SAVE.atmo.h, 0, 23.99);
    S.sched = rollDay(S.date.m);
    const tg = targets(S.hour, S.sched); S.cover = tg.cover; S.rain = tg.rain;
    H.roadBase.set('#9a9a96'); H.matVBase.copy(MAT_V.color);
    patchFacade(MAT_FAC);
    scanScene();
    if (H.road) { H.roadBase.copy(H.road.material.color); patchRoad(H.road.material); }
    const cat = LANDMARK_INFO.find(l => /Catedral/i.test(l.n)), gal = LANDMARK_INFO.find(l => /Galer/i.test(l.n)), park = LANDMARK_INFO.find(l => /Parque Bol/i.test(l.n));
    if (cat) { CATEDRAL.x = cat.x; CATEDRAL.z = cat.z; }
    const cc = gal || park || cat; if (cc) { CENTRO.x = cc.x; CENTRO.z = cc.z; }
    buildLights(); buildRain(); buildClouds(); buildHud();
    S.lastH = Math.floor(S.hour);
    applyTime(); updateSky(camera.position); updateHud(); updateSun(camera.position.x, camera.position.z);
    HOOKS.render = render;
    HOOKS.atmosphere = {
      cfg: ATM_CFG,
      setTime(h) { S.hour = ((h % 24) + 24) % 24; S.lastH = Math.floor(S.hour); const t = targets(S.hour, S.sched); S.cover = t.cover; S.rain = t.rain; applyTime(); },
      setWeather(w) { S.force = ['despejado', 'parcial', 'lluvia'].includes(w) ? w : null; },
      get state() { return { hour: S.hour, elev: S.elev, cover: S.cover, rain: S.rain, wet: S.wet, label: S.label, sched: S.sched, lamps: L.list.length }; },
    };
  }
  let scanT = 5;
  function update(dt, ctx) {
    S.realT += dt;
    const dH = dt * ATM_CFG.GAME_MIN_PER_REAL_MIN / 3600;
    S.hour += dH;
    if (S.hour >= 24) { S.hour -= 24; S.dayOff++; S.date = colDate(S.dayOff); S.sched = rollDay(S.date.m); }
    // weather toward targets

    S.flash = Math.max(0, S.flash - dt * 9);
    applyTime();
    const cam = camera.position;
    updateLights(dt, ctx, S.lampOn);
    updateSky(cam);
    updateRain(dt, cam, ctx.camDir || { x: 0, z: 0 });
    updateHud();
    // church bells on the hour
    const hi = Math.floor(S.hour);
    if (hi !== S.lastH) { S.lastH = hi; if (A.on) hourBells(hi); }
    if (!A.broken) try { updateAudio(dt, ctx); } catch (e) { console.error('atmosphere audio', e); A.broken = true; }

HOOKS.initAtmosphere = () => ATMOS.init();
HOOKS.updateAtmosphere = (dt, ctx) => ATMOS.update(dt, ctx);

// ===== 90_main.js
// Main: boot, loop, enter/exit, GPS, save.

const G = { parked: [], car: null, walker: null, inCar: true, started: false, route: null, routeT: 0, userWaypoint: null, saveT: 0, sigT: 0, frame: 0 };
let perf = { on: false, el: null, fps: 0, acc: 0, n: 0, worst: 0 };

function safePlace(x, z) {
  const ne = nearestEdge(x, z, 60, e => (CLASS_SPEED[e.cls] || 0) > 0 && e.cls !== 'service');
  if (!ne) return null;
  const p = edgePoint(ne.e, ne.s), dir = ne.e.o === -1 ? -1 : 1, off = ne.e.o === 0 ? ne.e.w / 4 : 0;
  const fx = p.dx * dir, fz = p.dz * dir;
  return { x: ne.x + (-fz) * off, z: ne.z + fx * off, a: Math.atan2(-fz, fx) };
}
function resetToStart() {
  const s = safePlace(PLACES.start.x, PLACES.start.z) || { x: 0, z: 40, a: 0 };
  cullChunks(s.x, s.z); streamBuildings(s.x, s.z, 0, 0, 30);
  if (!G.inCar) toggleCar(true);
  G.car.place(s.x, s.z, s.a); PURSUIT.clear(); CAM.yaw = s.a; CAM.pos.set(s.x - Math.cos(s.a) * 8, 3, s.z + Math.sin(s.a) * 8);
}
function toggleCar(forceIn) {
  const car = G.car, w = G.walker;
  if (G.inCar && !forceIn) {
    if (car.speed > 3) { toast('Frena primero', ''); return; }
    let d = car.doorPos(); if (collideCircle(d.x, d.z, 0.4)) { const s = car.t.Wd / 2 + 0.9; d = { x: car.x - Math.sin(car.a) * -s, z: car.z - Math.cos(car.a) * -s }; }
    w.x = d.x; w.z = d.z; w.a = car.a; w.y = groundAt(w.x, w.z); w.root.visible = true; G.inCar = false; car.setOccupied(false); AUDIO.door();
    if (NPCS.cuidador && !MISSIONS.active?.race) NPCS.cuidador.onPark(car);
  } else {
    G.inCar = true; car.setOccupied(true); w.root.visible = false; AUDIO.door();
  }
}
function takeVehicle(type, color, x, z, a, opts = {}) {
  const old = G.car;
  if (!opts.replaceOld) { G.parked.push(old); old.setOccupied(false); if (G.parked.length > 3) G.parked.shift().remove(); }
  else old.remove();
  G.parked = G.parked.filter(p => p !== opts.fromParked);
  const car = opts.fromParked || new PlayerCar(type, color);
  if (!opts.fromParked) { car.place(x, z, a); car.damage = 0; }
  G.car = car; G.inCar = true; car.setOccupied(true); G.walker.root.visible = false; AUDIO.door();
  SAVE.vehicle = { type: car.type, color: car.color }; SAVE.damage = car.damage; persist();
  toast(car.t.name, opts.stolen ? 'Vehículo robado' : '');
}
function carjack(agent, isPatrol) {
  const type = isPatrol ? 'patrol' : agent.type, color = agent.color || '#f1f3f2';
  const x = agent.x, z = agent.z, a = agent.a;
  agent.active = false; agent.mesh.visible = false;
  // the driver gets out and runs
  const p = PEDS.list.find(q => !q.active);
  if (p) { const s = sidewalkSpot(x, z); p.active = true; p.x = x + Math.sin(a) * 1.5; p.z = z + Math.cos(a) * 1.5; p.ring = s.ring || p.ring; p.s = s.s; p.v = 4.5; p.dir = 1; p.jump = 0.5; p.down = 0; if (!p.ring) p.active = false; }
  talk('Conductor', ['¡Ey, ese es mi carro!', '¡Auxilio, me robaron!', '¡Llévese el carro pero no el almuerzo que está atrás!'][Math.floor(Math.random() * 3)]);
  takeVehicle(type, color, x, z, a, { stolen: true });
  const witnesses = PEDS.list.some(q => q.active && Math.hypot(q.x - x, q.z - z) < 35);
  PURSUIT.addHeat(isPatrol ? 3.2 : witnesses ? 1.2 : 0.6, x, z, isPatrol ? '¡Te robaste una patrulla!' : 'Robo de vehículo reportado.');
}
function savePosition() {
  const p = safePlace(G.car.x, G.car.z);
  if (p) SAVE.pos = p;
  SAVE.damage = G.car.damage; SAVE.vehicle = { type: G.car.type, color: G.car.color }; persist();
}

function boot() {
  const t0 = performance.now();
  const stats = buildWorld();
  // optional modules owned by other workstreams (each defines its functions in its own file)
  for (const f of ['buildLandmarksDetailed', 'buildStreet', 'initAtmosphere']) { try { const fn = HOOKS[f]; if (fn) fn(); } catch (e) { console.error(f, e); } }
  renderMapRaster();
  initTraffic(); initPeds(); initPursuit(); initMissions(); initNpcs(); initDealer(); setupBigMap();
  if (IS_TOUCH) setupTouch();
  G.car = new PlayerCar(SAVE.vehicle?.type && VTYPES[SAVE.vehicle.type] ? SAVE.vehicle.type : 'hatch', SAVE.vehicle?.color || SAVE.color);
  G.walker = new Walker();
  const s = (SAVE.pos && safePlace(SAVE.pos.x, SAVE.pos.z)) || safePlace(PLACES.start.x, PLACES.start.z) || { x: 0, z: 40, a: 0 };
  G.car.place(s.x, s.z, SAVE.pos ? SAVE.pos.a : s.a); CAM.yaw = G.car.a;
  cullChunks(G.car.x, G.car.z); while (streamBuildings(G.car.x, G.car.z, 0, 0, 8) > 0 && BCH.built < 400) { }
  CAM.pos.set(G.car.x - Math.cos(G.car.a) * 8, 3, G.car.z + Math.sin(G.car.a) * 8);
  for (const d of MISSIONS.defs) if (d.marker) d.marker.visible = !d.needs || !!SAVE.done[d.needs];
  console.info('Palmira boot', Math.round(performance.now() - t0) + 'ms', stats, 'buildings', W.buildings.length, 'edges', W.edges.length);
  $('loading').hidden = true;
  updateHud(0.3); drawMinimap();
  window.PALMIRA = { HOOKS, NPCS, PLACES, G, CAM, camera, W, TRAFFIC, PEDS, PURSUIT, MISSIONS, renderer, scene, SAVE, tick: (n = 60, ms = 16.7) => { for (let i = 0; i < n; i++) { stepping = true; loop(last + ms); } stepping = false; } };
  titleMenu();
  addEventListener('keydown', e => { if (e.key === '`' || e.key === 'F3') { perf.on = !perf.on; if (!perf.el) { perf.el = document.createElement('div'); perf.el.className = 'hud panel'; perf.el.style.cssText = 'left:12px;top:50%;padding:8px 10px;font:12px/1.4 ui-monospace,monospace;white-space:pre'; document.body.appendChild(perf.el); } perf.el.hidden = !perf.on; } });
  addEventListener('pagehide', savePosition);
  document.addEventListener('visibilitychange', () => { if (document.hidden) savePosition(); });
  last = performance.now(); requestAnimationFrame(loop);
}

let last = 0;
let stepping = false;
function loop(now) {
  if (!stepping) requestAnimationFrame(loop);
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  dt *= (HOOKS.timeScale ?? 1);   // slow motion on DETENIDO / HERIDO screens
  G.frame++;
  readInput();
  if (pressed.has('menu')) { if (BIG.open) closeBigMap(); else if (MENU.open) { if (G.started) closeMenu(); } else pauseMenu(); }
  if (pressed.has('map') && G.started && !MENU.open) { BIG.open ? closeBigMap() : openBigMap(); }
  const paused = !G.started || MENU.open || BIG.open;

  if (pressed.has('horn') && G.inCar) { AUDIO.playerHorn(); startlePeds(G.car); }

  const car = G.car, w = G.walker;
  car.update(dt, input);
  if (car.impact > 3) AUDIO.crash(car.impact);
  if (!G.inCar) w.update(dt, input, camForwardYaw());
  const me = G.inCar ? car : w;
  const camDir = { x: Math.cos(camForwardYaw()), z: -Math.sin(camForwardYaw()) };
  const ctx = { px: me.x, pz: me.z, car, walker: G.inCar ? null : w, camDir, speed: G.inCar ? car.speed : w.speed * 0.3 };
  const hit = collideTraffic(car); if (hit > 3) AUDIO.crash(hit);
  updateTraffic(dt, ctx);
  updatePeds(dt, ctx);
  updatePursuit(dt, ctx);
  updateMissions(dt, ctx);
  updateDealer(dt, ctx);
  updateNpcs(dt, ctx);
  for (const f of ['updateStreet', 'updateAtmosphere']) { const fn = HOOKS[f]; if (fn) try { fn(dt, ctx); } catch (e) { console.error(f, e); HOOKS[f] = null; } }
  for (const pc of G.parked) pc.update(dt, input);
  // enter / exit / steal / talk
  const K = IS_TOUCH ? 'Usar' : 'E';
  if (G.inCar) { if (pressed.has('use')) toggleCar(); }
  else if (!promptShown) {   // named NPC / mission prompts take priority
    const near = (o, r) => o && Math.hypot(w.x - o.x, w.z - o.z) < r;
    let act = null;
    if (near(car, 4)) act = { label: car.t.moto ? 'Subirse a la moto' : 'Subir al carro', run: () => toggleCar() };
    if (!act) { const pc = G.parked.find(p => near(p, 4)); if (pc) act = { label: 'Subir: ' + pc.t.name, run: () => takeVehicle(pc.type, pc.color, 0, 0, 0, { fromParked: pc }) }; }
    if (!act) { const ag = TRAFFIC.pool.find(a => a.active && near(a, a.t.moto ? 3 : 4.2)); if (ag) act = { label: (ag.t.moto ? 'Quitarle la moto' : 'Robar ' + ag.t.name), run: () => carjack(ag, false) }; }
    if (!act) { const pt = PURSUIT.patrols.find(p => p.active && near(p, 4.2)); if (pt) act = { label: 'Robar la patrulla', run: () => carjack(pt, true) }; }
    if (!act) { const pd = nearestPed(w.x, w.z, 2.6); if (pd) act = { label: 'Hablar', run: () => { pd.talkT = 4; talk('Peatón', PED_LINES[Math.floor(Math.random() * PED_LINES.length)]); } }; }
    if (act) { showPrompt(`<kbd>${K}</kbd> ${act.label}`); if (pressed.has('use')) act.run(); }

  if (tgt && G.routeT <= 0) {

    const r = route(me.x, me.z, tgt.x, tgt.z, true) || route(me.x, me.z, tgt.x, tgt.z, false);
    G.route = r ? r.pts : null; setGpsLine(G.route);
  }
  if (!tgt && G.route) { G.route = null; setGpsLine(null); }
  if (G.userWaypoint && Math.hypot(G.userWaypoint.x - me.x, G.userWaypoint.z - me.z) < 15) { G.userWaypoint = null; toast('Llegaste', ''); }
  CULL.t -= dt; if (CULL.t <= 0) { CULL.t = 0.4; cullChunks(me.x, me.z); }
  streamBuildings(me.x, me.z, G.inCar ? car.vx : 0, G.inCar ? car.vz : 0, 1);
  updateCamera(dt, G.inCar ? car : w, G.inCar);
  updateSun(me.x, me.z);
  updateHud(dt);
  if (G.frame % (IS_TOUCH ? 3 : 2) === 0) drawMinimap();
  AUDIO.update(dt, { inCar: G.inCar, vF: car.vFcache || 0, throttle: input.throttle, slip: car.slip || 0 });

    if (perf.acc > 0.5) { perf.fps = perf.n / perf.acc; const i = renderer.info.render; perf.el.textContent = `${perf.fps.toFixed(0)} fps · peor ${(perf.worst * 1000).toFixed(0)} ms\n${i.calls} draw calls · ${(i.triangles / 1000).toFixed(0)}k tris\ntráfico ${TRAFFIC.pool.filter(a => a.active).length}/${TRAFFIC.max} · peatones ${PEDS.list.filter(p => p.active).length}\n${SAVE.settings.quality} · dpr ${renderer.getPixelRatio()}`; perf.acc = 0; perf.n = 0; perf.worst = 0; }
  }
}

try { boot(); } catch (e) { console.error(e); $('loading').textContent = 'No se pudo cargar: ' + e.message; }
